  - {nome: "Feriado de Natal", dia: "12-25", tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 1}
  - {nome: "Feriado de Ano-Novo", dia: "01-01", tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 2}
  - {nome: "Feriado da Sexta-feira Santa", pascoa: -2, tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 2}
  - {nome: "Feriado de Tiradentes", dia: "04-21", tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 2}
  - {nome: "Feriado do Dia do Trabalho", dia: "05-01", tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 2}
  - {nome: "Feriado de Corpus Christi", pascoa: 60, tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 2, nota: "ponto facultativo nacional; feriado em muitas cidades"}
  - {nome: "Feriado da Independência", dia: "09-07", tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 2}
  - {nome: "Feriado de Nossa Senhora Aparecida", dia: "10-12", tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 1, nota: "mesmo dia do Dia das Crianças"}
  - {nome: "Feriado de Finados", dia: "11-02", tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 2}
  - {nome: "Feriado da Proclamação da República", dia: "11-15", tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 2}
  - {nome: "Feriado da Consciência Negra", dia: "11-20", tipo: feriado, antecedencia_dias: 3, segmentos: [todos], peso: 2}

# Datas que se repetem todo mês (o código gera uma por mês na janela da agenda)
recorrentes:
  - {nome: "Vencimento do DAS do MEI", dia_do_mes: 20, tipo: obrigacao, antecedencia_dias: 4, segmentos: [todos], peso: 2, nota: "guia mensal do MEI; se cair em fim de semana ou feriado, vence no dia útil seguinte"}

# Regras da agenda (código, sem LLM)
regras:
  segmento_nao_repete_em_dias_seguidos: true
  todos_os_pilares_por_semana: true
  sugestoes_por_semana: 5
  max_posts_por_data_na_semana: 2  # a mesma data não domina a semana; o próprio dia não conta neste limite
  pular_dias_fracos: true          # salvo se for o próprio dia de uma data de venda, obrigação ou comunidade
  dias_depois_temporada: 3         # trocas e pós-venda nos dias seguintes a uma temporada
